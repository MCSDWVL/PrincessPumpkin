<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f6eafa">
  <title>Princess Pumpkin Party</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    /* This full-screen toddler game handles touch input instead of browser gestures. */
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; touch-action: none; }
    body { background: #e7d8ef; color: #674576; font-family: "Trebuchet MS", "Arial Rounded MT Bold", sans-serif; user-select: none; -webkit-user-select: none; }
    button { font: inherit; touch-action: none; cursor: pointer; }
    button:focus-visible { outline: 4px solid #9160c1; outline-offset: 5px; }
    svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .symbols { position: absolute; width: 0; height: 0; overflow: hidden; }
    .game { position: relative; height: calc(100% - 28px); height: calc(100dvh - 28px); margin: 14px; overflow: hidden; isolation: isolate; border-radius: 27px; background: #fbf0f5; border: 2px solid #fff8fc; }
    .landscape { position: absolute; inset: 0; pointer-events: none; }
    .landscape svg { overflow: hidden; }
    header { position: absolute; z-index: 3; top: 6%; left: 20%; right: 20%; text-align: center; pointer-events: none; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(32px, 4.8vw, 68px); line-height: .98; font-weight: normal; letter-spacing: -2px; color: #79518d; }
    h1 span { display: block; color: #ca7198; font-style: italic; }
    .sound { position: absolute; z-index: 6; top: 28px; left: 28px; display: flex; align-items: center; gap: 8px; padding: 11px 15px; background: #fffafbd9; color: #8a689b; border: 1px solid #eadcec; border-radius: 30px; font-size: 12px; font-weight: bold; }
    .sound svg { width: 20px; height: 20px; }
    .sound .on-waves { display: none; }
    .sound[aria-pressed="true"] .on-waves { display: block; }
    .sound[aria-pressed="true"] .off-line { display: none; }
    .score-card { position: absolute; z-index: 4; right: 28px; top: 26px; min-width: 105px; padding: 12px 18px; border: 1px solid #eadcec; border-radius: 23px; background: #fffafbe6; text-align: center; box-shadow: 0 5px 0 #bfa0cc0d; }
    .score-main { display: flex; justify-content: center; align-items: center; gap: 9px; }
    .score-main svg { width: 31px; height: 31px; }
    #score { font-size: 32px; line-height: 1.1; font-weight: bold; font-variant-numeric: tabular-nums; }
    .score-label { display: block; margin-top: 5px; text-transform: uppercase; font-size: 9px; font-weight: bold; letter-spacing: 2px; color: #ae8bb9; }
    .patch { position: absolute; z-index: 2; left: 34%; right: 5%; top: 32%; bottom: 13%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .slot { display: flex; justify-content: center; align-items: center; position: relative; min-width: 0; min-height: 0; }
    .pumpkin { border: 0; padding: 0; background: transparent; width: min(100%, 190px); height: min(100%, 170px); position: relative; animation: sprout .4s cubic-bezier(.2, 1.5, .4, 1) both; }
    .pumpkin svg { transition: filter .15s; }
    @media (hover: hover) { .pumpkin:hover svg { filter: brightness(1.07) drop-shadow(0 0 9px #fff5b8aa); } }
    .pumpkin:active svg { transform: scale(.9); }
    .pumpkin .eye { transform-box: fill-box; transform-origin: center; animation: blink 5.8s infinite; animation-delay: var(--blink); }
    .princess-area { position: absolute; z-index: 3; left: 6%; bottom: 11%; width: 25%; height: 53%; pointer-events: none; }
    .princess { position: absolute; bottom: 0; width: 100%; height: 100%; transform-origin: 50% 95%; }
    .princess .arm { transform-origin: 171px 177px; animation: wave 2.8s ease-in-out infinite; }
    .princess .princess-eyes { transform-box: fill-box; transform-origin: center; animation: blink 6.7s infinite; }
    .speech { position: absolute; z-index: 1; top: -11%; left: 50%; transform: translateX(-50%) rotate(-4deg); white-space: nowrap; background: #fffafc; border: 1px solid #ecd5e8; border-radius: 20px; padding: 12px 21px; color: #b36495; font-size: clamp(14px, 1.6vw, 22px); font-weight: bold; box-shadow: 0 4px 0 #d6bdd52b; }
    .speech::after { content: ""; position: absolute; bottom: -7px; left: 45%; width: 12px; height: 12px; background: #fffafc; border-right: 1px solid #ecd5e8; border-bottom: 1px solid #ecd5e8; transform: rotate(45deg); }
    .garden-note { position: absolute; bottom: 4%; left: 0; right: 0; text-align: center; font-size: 10px; font-weight: bold; letter-spacing: 3px; color: #987da5; pointer-events: none; }
    .garden-note span { color: #cb8fac; padding: 0 10px; }
    .garden-note { transition: opacity .6s; }
    .game.has-candy .garden-note { opacity: 0; }
    #candy-pile { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
    .pile-candy { position: absolute; top: 0; left: 0; filter: drop-shadow(0 2px 1px #77538330); }
    #effects { position: fixed; inset: 0; z-index: 10; overflow: hidden; pointer-events: none; }
    .particle { position: absolute; width: 33px; height: 33px; will-change: transform, opacity; }
    .pop-label { position: absolute; font-size: 32px; font-weight: bold; color: #b26694; text-shadow: 0 2px white, 2px 0 white, 0 -2px white, -2px 0 white; }
    .rainbow { position: absolute; z-index: 1; top: 18%; left: 24%; width: 65%; height: 68%; opacity: 0; pointer-events: none; }
    @keyframes sprout { from { transform: scale(.25); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.12); } }
    @keyframes wave { 0%, 55%, 100% { transform: rotate(0deg); } 65%, 85% { transform: rotate(-14deg); } 75%, 95% { transform: rotate(7deg); } }
    @media (max-width: 640px) and (orientation: portrait) {
      .game { margin: 7px; height: calc(100% - 14px); height: calc(100dvh - 14px); border-radius: 22px; }
      header { top: 9%; left: 8%; right: 8%; }
      h1 { font-size: clamp(32px, 9vw, 49px); letter-spacing: -1.5px; }
      .sound { top: 12px; left: 12px; padding: 9px; }
      .sound span { display: none; }
      .score-card { top: 10px; right: 12px; padding: 6px 11px; min-width: 65px; border-radius: 17px; }
      .score-main { gap: 5px; }
      .score-main svg { width: 22px; height: 22px; }
      #score { font-size: 23px; }
      .score-label { font-size: 7px; letter-spacing: 1px; margin-top: 2px; }
      .patch { top: 29%; bottom: 27%; left: 8%; right: 8%; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 4px 24px; }
      .pumpkin { max-width: 146px; }
      .princess-area { left: 12%; bottom: 4%; height: 23%; width: 36%; }
      .speech { left: 112%; top: 30%; font-size: 16px; padding: 10px 15px; transform: rotate(-4deg); }
      .speech::after { left: -7px; bottom: 12px; transform: rotate(135deg); }
      .garden-note { bottom: 1.7%; font-size: 7px; letter-spacing: 2px; }
      .rainbow { left: 0; top: 27%; width: 100%; height: 45%; }
    }
    @media (max-height: 500px) and (orientation: landscape) {
      .game { margin: 6px; height: calc(100% - 12px); height: calc(100dvh - 12px); border-radius: 19px; }
      header { top: 6%; }
      h1 { font-size: 31px; }
      h1 span { display: inline; }
      .sound { top: 14px; left: 14px; padding: 8px; }
      .sound span { display: none; }
      .score-card { top: 11px; right: 14px; min-width: 70px; padding: 6px 10px; }
      #score { font-size: 24px; }
      .score-label { font-size: 7px; }
      .score-main svg { width: 24px; height: 24px; }
      .patch { top: 30%; bottom: 8%; gap: 3px 15px; }
      .princess-area { height: 62%; bottom: 7%; }
      .speech { top: -6%; padding: 7px 12px; font-size: 13px; }
      .garden-note { bottom: 2%; font-size: 7px; }
    }
  </style>
</head>

  <script>
    (() => {
      'use strict';
      const patch = document.getElementById('patch');
      const effects = document.getElementById('effects');
      const candyPile = document.getElementById('candy-pile');
      const game = document.querySelector('.game');
      const scoreDisplay = document.getElementById('score');
      const princess = document.getElementById('princess');
      const speech = document.getElementById('speech');
      const rainbow = document.getElementById('rainbow');
      const soundButton = document.getElementById('sound');
      const colors = ['#ec91b6', '#af96db', '#85c6bb', '#f2c16a', '#f6a17e', '#8dbbe2'];
      const cheers = ['Hooray!', 'Candy magic!', 'Hee hee!', 'So sparkly!', 'Yippee!', 'Sweet surprise!'];
      const slots = Array.from({ length: 6 }, () => {
        const slot = document.createElement('div');
        slot.className = 'slot';
        patch.append(slot);
        return slot;
      });
      let score = 0;
      let soundOn = false;
      let audioContext;
      let speechTimer;
      let princessAnimation;
      let scoreAnimation;
      let rainbowAnimation;
      const random = (min, max) => min + Math.random() * (max - min);
      const collectedCandy = [];
      let pileLayout;
      let pileFrame = 0;
      let lastPileTime = 0;
      let settleUntil = 0;

      function drawCandy(candy) {
        candy.element.style.transform = `translate(${candy.x - candy.size / 2}px,${candy.y - candy.size / 2}px) rotate(${candy.rotation}rad)`;
      }

      function constrainCandy(candy) {
        const margin = candy.size * .72;
        if (candy.x < margin || candy.x > pileLayout.width - margin) {
          candy.x = Math.max(margin, Math.min(pileLayout.width - margin, candy.x));
          candy.vx *= -.2;
        }
        if (candy.y > pileLayout.height - margin) {
          candy.y = pileLayout.height - margin;
          if (candy.vy > 0) candy.vy *= -.12;
          candy.vx *= .7;
          candy.spin *= .7;
        }
      }

      function stepPile(time) {
        const dt = Math.min((time - lastPileTime) / 1000 || 1 / 60, 1 / 30);
        lastPileTime = time;
        for (const candy of collectedCandy) {
          candy.vy += 520 * dt;
          candy.x += candy.vx * dt;
          candy.y += candy.vy * dt;
          candy.rotation += candy.spin * dt;
          constrainCandy(candy);
        }
        // Round candy bodies collide and slide into gaps, making an irregular
        // heap. Wrappers overlap a little, as they would in a real candy pile.
        for (let pass = 0; pass < 5; pass++) {
          for (let i = 0; i < collectedCandy.length; i++) {
            const a = collectedCandy[i];
            for (let j = i + 1; j < collectedCandy.length; j++) {
              const b = collectedCandy[j];
              const dx = b.x - a.x, dy = b.y - a.y;
              const radius = (a.size + b.size) * .34;
              const squaredDistance = dx * dx + dy * dy;
              if (squaredDistance >= radius * radius) continue;
              const distance = Math.sqrt(squaredDistance);
              const nx = distance > .001 ? dx / distance : 1;
              const ny = distance > .001 ? dy / distance : 0;
              const overlap = (radius - distance) / 2;
              a.x -= nx * overlap; a.y -= ny * overlap;
              b.x += nx * overlap; b.y += ny * overlap;
              const approach = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
              if (approach < 0) {
                const impulse = approach * .53;
                a.vx += impulse * nx; a.vy += impulse * ny;
                b.vx -= impulse * nx; b.vy -= impulse * ny;
                // Contact friction keeps the heap from rolling into a flat row.
                a.vx *= .78; b.vx *= .78;
                a.spin *= .75; b.spin *= .75;
              }
            }
          }
          collectedCandy.forEach(constrainCandy);
        }
        collectedCandy.forEach(drawCandy);
        pileFrame = time < settleUntil ? requestAnimationFrame(stepPile) : 0;
      }

      function wakePile() {
        settleUntil = performance.now() + 6500;
        if (!pileFrame && collectedCandy.length) {
          lastPileTime = performance.now();
          pileFrame = requestAnimationFrame(stepPile);
        }
      }

      function resizePile() {
        const bounds = candyPile.getBoundingClientRect();
        const previous = pileLayout;
        pileLayout = { width: bounds.width, height: bounds.height, capacity: Math.max(24, Math.min(200, Math.floor(bounds.width / 32) * 6)) };
        while (collectedCandy.length > pileLayout.capacity) {
          collectedCandy.shift().element.remove();
        }
        collectedCandy.forEach(candy => {
          candy.x *= bounds.width / previous.width;
          candy.y = bounds.height - (previous.height - candy.y);
          candy.y = Math.max(candy.size, candy.y);
          candy.vx = 0; candy.vy = 0;
          constrainCandy(candy);
          drawCandy(candy);
        });
        wakePile();
      }

      function collectCandy(x, y) {
        game.classList.add('has-candy');
        const bounds = candyPile.getBoundingClientRect();
        for (let i = 0; i < 2; i++) {
          // Recycle buried pieces during long sessions; the heap stays bounded.
          if (collectedCandy.length >= pileLayout.capacity) {
            collectedCandy.shift().element.remove();
          }
          const element = document.createElement('div');
          element.className = 'pile-candy';
          element.style.color = colors[Math.floor(random(0, colors.length))];
          element.innerHTML = '<svg viewBox="0 0 48 48"><use href="#candy-art"/></svg>';
          const size = random(28, 38);
          element.style.width = element.style.height = `${size}px`;
          const startX = x - bounds.left + random(-10, 10);
          const startY = y - bounds.top;
          const flightTime = (150 + Math.sqrt(150 * 150 + 1040 * Math.max(0, bounds.height - startY))) / 520;
          const destination = bounds.width * .55 + random(-Math.min(70, bounds.width * .14), Math.min(70, bounds.width * .14));
          const candy = { element, size, x: startX, y: startY, vx: (destination - startX) / flightTime, vy: -150, rotation: random(-Math.PI, Math.PI), spin: random(-4, 4) };
          collectedCandy.push(candy);
          drawCandy(candy);
          candyPile.append(element);
        }
        wakePile();
      }

      function animateAway(element, frames, options) {
        // Bound the particle count even during enthusiastic multi-finger play.
        while (effects.childElementCount >= 180) {
          const oldest = effects.firstElementChild;
          oldest.getAnimations().forEach(animation => animation.cancel());
          oldest.remove();
        }
        effects.append(element);
        const animation = element.animate(frames, options);
        animation.finished.then(() => element.remove(), () => element.remove());
      }

      function particle(x, y, kind, color, dx, dy, duration, size = 33) {
        const element = document.createElement('div');
        element.className = 'particle';
        element.style.cssText = `left:${x - size / 2}px;top:${y - size / 2}px;width:${size}px;height:${size}px;color:${color}`;
        element.innerHTML = `<svg viewBox="0 0 ${kind === 'candy' ? '48 48' : kind === 'lolly' ? '40 48' : '40 40'}"><use href="#${kind}-art"/></svg>`;
        const spin = random(-230, 230);
        animateAway(element, [
          { transform: 'translate(0,0) scale(.4) rotate(0deg)', opacity: 0 },
          { transform: `translate(${dx * .3}px,${dy * .65}px) scale(1.15) rotate(${spin * .3}deg)`, opacity: 1, offset: .22 },
          { transform: `translate(${dx * .8}px,${dy}px) scale(1) rotate(${spin * .8}deg)`, opacity: 1, offset: .65 },
          { transform: `translate(${dx}px,${dy + 110}px) scale(.6) rotate(${spin}deg)`, opacity: 0 }
        ], { duration, easing: 'ease-out', fill: 'forwards' });
      }

      function burst(x, y) {
        collectCandy(x, y);
        for (let i = 0; i < 18; i++) {
          const angle = (i / 18) * Math.PI * 2;
          const distance = random(75, 180);
          particle(x, y, ['candy', 'lolly', 'star'][i % 3], colors[i % colors.length], Math.cos(angle) * distance, Math.sin(angle) * distance - 85, random(850, 1300), random(23, 42));
        }
        const label = document.createElement('div');
        label.className = 'pop-label';
        label.textContent = '+1';
        label.style.cssText = `left:${x - 18}px;top:${y - 30}px`;
        animateAway(label, [{ transform: 'translateY(0) scale(.6)', opacity: 1 }, { transform: 'translateY(-90px) scale(1.2)', opacity: 0 }], { duration: 950, easing: 'ease-out' });
      }

      function cheer(milestone) {
        clearTimeout(speechTimer);
        speech.textContent = milestone ? 'Rainbow party!' : cheers[Math.floor(Math.random() * cheers.length)];
        speechTimer = setTimeout(() => { speech.textContent = 'More pumpkins!'; }, 2300);
        princessAnimation?.cancel();
        princessAnimation = princess.animate([
          { transform: 'translateY(0) rotate(0)' },
          { transform: 'translateY(-20px) rotate(-5deg)', offset: .28 },
          { transform: 'translateY(0) rotate(3deg)', offset: .55 },
          { transform: 'translateY(-10px) rotate(-3deg)', offset: .77 },
          { transform: 'translateY(0) rotate(0)' }
        ], { duration: 650, easing: 'ease-in-out' });
        const rect = princess.getBoundingClientRect();
        for (let i = 0; i < 4; i++) {
          particle(rect.x + rect.width / 2, rect.y + rect.height * .35, 'heart', colors[i % 2], random(-75, 75), random(-110, -55), 1100, random(17, 29));
        }
        if (milestone) {
          rainbowAnimation?.cancel();
          rainbowAnimation = rainbow.animate([{ opacity: 0, transform: 'scale(.8)' }, { opacity: .9, transform: 'scale(1)', offset: .2 }, { opacity: .9, transform: 'scale(1)', offset: .7 }, { opacity: 0, transform: 'scale(1.06)' }], { duration: 2600, easing: 'ease-out' });
          for (let i = 0; i < 38; i++) {
            particle(random(0, innerWidth), random(-60, 20), i % 3 ? 'candy' : 'star', colors[i % colors.length], random(-80, 80), innerHeight * .7, random(1800, 2700), random(22, 40));
          }
        }
      }

      function playNotes(milestone) {
        if (!soundOn || !audioContext || audioContext.state !== 'running') return;
        const notes = milestone ? [523.25, 659.25, 783.99, 1046.5] : [659.25, 880];
        notes.forEach((frequency, i) => {
          const start = audioContext.currentTime + i * .105;
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(frequency, start);
          gain.gain.setValueAtTime(0, start);
          gain.gain.linearRampToValueAtTime(.055, start + .012);
          gain.gain.exponentialRampToValueAtTime(.001, start + .25);
          oscillator.connect(gain);
          gain.connect(audioContext.destination);
          oscillator.start(start);
          oscillator.stop(start + .27);
          oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
        });
      }

      function popPumpkin(button) {
        if (!button.isConnected || button.disabled) return;
        button.disabled = true;
        const rect = button.getBoundingClientRect();
        button.remove();
        score += 1;
        scoreDisplay.textContent = String(score);
        scoreAnimation?.cancel();
        scoreAnimation = scoreDisplay.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.3)' }, { transform: 'scale(1)' }], { duration: 260 });
        burst(rect.x + rect.width / 2, rect.y + rect.height / 2);
        cheer(score % 10 === 0);
        playNotes(score % 10 === 0);
        setTimeout(addPumpkin, 550);
      }

      function addPumpkin() {
        if (document.hidden) return;
        const empty = slots.filter(slot => !slot.firstElementChild);
        if (empty.length <= 1) return;
        const slot = empty[Math.floor(Math.random() * empty.length)];
        const button = document.createElement('button');
        button.className = 'pumpkin';
        button.type = 'button';
        button.setAttribute('aria-label', 'Pop a pumpkin!');
        button.style.setProperty('--blink', `${random(-6, 0)}s`);
        button.innerHTML = '<svg viewBox="0 0 180 160" aria-hidden="true"><use href="#pumpkin-art"/></svg>';
        button.addEventListener('pointerdown', event => {
          // Touch is activated by the non-passive touchstart handler below.
          if (event.pointerType === 'touch' || event.button !== 0) return;
          event.preventDefault();
          popPumpkin(button);
        });
        // Keyboard and assistive-technology activation use click instead.
        button.addEventListener('click', () => popPumpkin(button));
        slot.append(button);
      }

      function updateSoundButton() {
        soundButton.setAttribute('aria-pressed', String(soundOn));
        soundButton.setAttribute('aria-label', soundOn ? 'Turn sound off' : 'Turn sound on');
        soundButton.title = soundOn ? 'Turn sound off' : 'Turn sound on';
        document.getElementById('sound-label').textContent = soundOn ? 'Sound on' : 'Sound off';
      }

      soundButton.addEventListener('click', async () => {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          document.getElementById('sound-label').textContent = 'Sound unavailable';
          soundButton.setAttribute('aria-label', 'Sound unavailable in this browser');
          return;
        }
        soundOn = !soundOn;
        updateSoundButton();
        try {
          audioContext ||= new AudioContextClass();
          if (soundOn) {
            await audioContext.resume();
            // The child may have switched it back off while resume was pending.
            if (soundOn) playNotes(false);
            else await audioContext.suspend();
          } else {
            await audioContext.suspend();
          }
        } catch {
          soundOn = false;
          updateSoundButton();
        }
      });

      // iPhone Safari can still recognize double-tap zoom when a tapped pumpkin
      // disappears. Cancel native touch gestures before removing its target,
      // then activate buttons ourselves so rapid taps still work immediately.
      // Explicit passive:false is essential for document-level touch listeners.
      const touchOptions = { passive: false, capture: true };
      const cancelGesture = event => { if (event.cancelable) event.preventDefault(); };
      document.addEventListener('touchstart', event => {
        cancelGesture(event);
        const buttons = new Set();
        for (const touch of event.changedTouches) {
          const button = touch.target instanceof Element ? touch.target.closest('button') : null;
          if (button && game.contains(button)) buttons.add(button);
        }
        buttons.forEach(button => button.click());
      }, touchOptions);
      for (const type of ['touchmove', 'touchend', 'gesturestart', 'gesturechange', 'gestureend', 'dblclick']) {
        document.addEventListener(type, cancelGesture, touchOptions);
      }

      resizePile();
      new ResizeObserver(resizePile).observe(candyPile);
      for (let i = 0; i < 3; i++) addPumpkin();
      setInterval(addPumpkin, 900);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          addPumpkin();
          wakePile();
        }
      });
    })();
  </script>
</body>
</html>
